services:
  web:
    image: node:22-alpine
    container_name: web-sejmsim
    restart: unless-stopped
    working_dir: /app
    command: ["node", ".output/server/index.mjs"]
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      NITRO_HOST: "0.0.0.0"
      NITRO_PORT: "3000"
      DATA_DIR: "/app/data"
      ANALYTICS_KEY: "L7HJ,+Ki(aW]2^PtwZsKX$^}"
      DISCORD_FEEDBACK_WEBHOOK_URL: "${DISCORD_FEEDBACK_WEBHOOK_URL:-}"
    ports:
      - "8084:3000"
    volumes:
      - /home/jifo/websites/sejmsim:/app:ro
      - /home/jifo/websites/sejmsim/data:/app/data:rw
